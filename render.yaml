# FREE personal Veo test server. No disk, no charge for the instance.
# Your project metadata is backed up to the same browser automatically (free mode).
# IMPORTANT: local uploaded video files and in-progress MP4 exports are temporary.
services:
  - type: web
    name: touchline-veo-free
    runtime: docker
    dockerfilePath: ./hosted/Dockerfile
    dockerContext: ./hosted
    plan: free
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: TOUCHLINE_CLOUD_MODE
        value: "1"
      - key: TOUCHLINE_FREE_MODE
        value: "1"
      - key: TOUCHLINE_DATA_DIR
        value: /tmp/touchline-free
      - key: TOUCHLINE_ACCESS_PASSWORD
        sync: false
