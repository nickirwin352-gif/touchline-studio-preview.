name: Publish Touchline Studio Classic

on:
  push:
    branches: [main]
    paths:
      - 'hosted/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
      - 'index.html'
      - 'app.js'
      - 'director.js'
      - 'recorder.js'
      - 'styles.css'
      - 'tests/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: touchline-classic-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test previous browser preview
        run: npm test
      - name: Install FFmpeg for original video exporter tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Test classic editor and backend
        working-directory: hosted
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Build classic GitHub Pages edition
        run: node scripts/build-classic.mjs
      - name: Validate classic script and bridge
        run: |
          node --check _site/classic/assets/app.js
          node --check _site/classic/bridge.js
          node --check hosted/web/free-persistence.js
      - name: Verify hosted editor link in the site launcher
        run: |
          grep -q 'https://touchline-veo-free.onrender.com/' _site/index.html
          grep -q 'href="./classic/"' _site/index.html
      - name: Check Render service reachability without credentials
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          status=$(curl --location --silent --show-error --max-time 110 --retry 2 --retry-delay 5 --retry-all-errors --output /dev/null --write-out '%{http_code}' 'https://touchline-veo-free.onrender.com/api/health' || true)
          echo "Render unauthenticated health response: HTTP $status"
          if [ "$status" = "401" ]; then
            echo "Render service is reachable and correctly requests owner authentication."
          elif [ "$status" = "200" ]; then
            echo "::warning::Render health endpoint responds without authentication; verify password protection."
          else
            echo "::warning::Render service was not confirmed online (HTTP $status). Check your Render deployment dashboard."
          fi
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Classic editor
        id: deployment
        uses: actions/deploy-pages@v4
