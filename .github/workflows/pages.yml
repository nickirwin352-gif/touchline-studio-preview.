name: Publish Touchline Studio

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'director.js'
      - 'recorder.js'
      - 'styles.css'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: touchline-public-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run browser editor tests
        run: npm test
      - name: Assemble static site with cache-busted assets
        run: |
          mkdir -p _site
          cp index.html app.js director.js recorder.js styles.css .nojekyll _site/
          sed -i "s/@@BUILD_SHA@@/${GITHUB_SHA}/g" _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload editor artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser editor
        id: deployment
        uses: actions/deploy-pages@v4
